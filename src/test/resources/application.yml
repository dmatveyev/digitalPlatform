spring:
  shell:
    interactive:
      enabled: false

  datasource:
    # In-memory H2 для тестов: DB_CLOSE_DELAY=-1 держит БД в памяти на всё время JVM,
    # что исключает конфликты при параллельном запуске и зависимость от файловой системы.
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    generate-ddl: false
    #generate-ddl: true
    hibernate:
      ddl-auto: none
      #ddl-auto: create
      show-sql: true
      format_sql: true
    show-sql: true
  security:
    # Тестовый профиль: тестовые значения намеренно hard-coded,
    # в production секреты задаются вне git.
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
      roles: ADMIN
  sql:
    init:
      mode: always


generators:
  type: BACKPACK_BELLMAN


