spring:
  application:
    name: DigitalPlatform
  datasource:
    url: jdbc:h2:file:./data/demo
    #url: jdbc:h2:mem:testdb
    username: sa
    password: password
  h2:
    # Консоль H2 отключена в production (план, этап 1, шаг 1.2)
    console:
      enabled: false
      path: /h2-console
  jpa:
    generate-ddl: false
    #generate-ddl: true
    hibernate:
      ddl-auto: none
      #ddl-auto: create
      show-sql: true
      format_sql: true
    show-sql: true
  security:
    # В production логин и пароль задаются вне git через переменные окружения
    # (например, export ADMIN_USERNAME / ADMIN_PASSWORD перед запуском).
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
      roles: ADMIN
  sql:
    init:
      mode: always

generators:
  type: BACKPACK_BELLMAN
logging:
  level:
    com:
      example:
        digitalplatform: DEBUG

automatic-assign:
  ##cron: '0 */1 * * * *'
  cron: '-'



